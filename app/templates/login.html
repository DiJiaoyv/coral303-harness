<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Harness</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #16213e; padding: 2rem; border-radius: 12px; width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin: 1rem 0 .3rem; font-size: .9rem; color: #aab; }
    input { width: 100%; padding: .6rem; border: 1px solid #334; border-radius: 6px; background: #0f3460; color: #fff; box-sizing: border-box; }
    button { width: 100%; margin-top: 1.2rem; padding: .7rem; background: #4a90d9; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #357abd; }
    .error { color: #ff6b6b; margin-top: .8rem; font-size: .9rem; }
    .link { margin-top: 1rem; text-align: center; font-size: .9rem; }
    a { color: #4a90d9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Harness 登录</h1>
    <form method="post">
      {{ form.hidden_tag() }}
      <label>{{ form.username.label }}</label>
      {{ form.username() }}
      <label>{{ form.password.label }}</label>
      {{ form.password() }}
      {{ form.submit() }}
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <p class="link">没有账号？<a href="{{ url_for('auth.register') }}">注册</a></p>
  </div>
</body>
</html>

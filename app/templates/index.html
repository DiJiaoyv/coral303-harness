<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ character_name }} - Harness</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; margin: 0; }
    header { background: #16213e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #4a90d9; text-decoration: none; margin-left: 1rem; }
    .container { display: grid; grid-template-columns: 1fr 300px; gap: 1rem; padding: 1rem 2rem; max-width: 1200px; margin: 0 auto; }
    #chat { background: #16213e; border-radius: 12px; padding: 1rem; min-height: 480px; max-height: 60vh; overflow-y: auto; }
    .msg { margin: .6rem 0; padding: .6rem .8rem; border-radius: 8px; max-width: 85%; }
    .msg.user { background: #0f3460; margin-left: auto; }
    .msg.bot { background: #1f4068; white-space: pre-wrap; }
    .input-row { display: flex; gap: .5rem; margin-top: 1rem; }
    #message { flex: 1; padding: .6rem; border-radius: 6px; border: 1px solid #334; background: #0f3460; color: #fff; }
    button { padding: .6rem 1.2rem; background: #4a90d9; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .5; }
    #stop { background: #c0392b; display: none; }
    aside { background: #16213e; border-radius: 12px; padding: 1rem; font-size: .9rem; }
    aside pre { white-space: pre-wrap; font-family: inherit; font-size: .85rem; color: #aab; }
    #progress { color: #4a90d9; margin-top: .5rem; min-height: 1.2rem; }
    aside .arc-status-card { font-size: .85rem; }
    aside .arc-status-card .card-header,
    aside .arc-status-card .card-body { background: #0f3460; color: #eee; border-color: #334; }
    aside .arc-status-card .text-muted { color: #9ab !important; }
    select { width: 100%; padding: .4rem; margin: .5rem 0; background: #0f3460; color: #fff; border: 1px solid #334; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <div>Harness · 欢迎，<strong>{{ username }}</strong></div>
    <div>
      <a href="{{ url_for('character_wizard.user_step1', reset=1) }}">创建角色</a>
      <a href="{{ url_for('memory.memory_page') }}">记忆</a>
      <a href="{{ url_for('auth.logout') }}">登出</a>
    </div>
  </header>
  <div class="container">
    <main>
      <h2>{{ character_name }} · {{ character_role }}</h2>
      <div id="chat"></div>
      <div id="progress"></div>
      <div class="input-row">
        <input id="message" type="text" placeholder="输入消息..." />
        <button id="send" type="button">发送</button>
        <button id="stop" type="button">停止</button>
      </div>
    </main>
    <aside>
      {% if arc_card_html %}
      <div class="arc-panel" style="margin-bottom:1rem;">{{ arc_card_html|safe }}</div>
      {% endif %}
      {% if active_character_id %}
      <p style="font-size:.8rem;margin-bottom:1rem;">
        <a href="{{ url_for('data.character_detail', character_id=active_character_id) }}" style="color:#4a90d9;">查看角色弧光详情 →</a>
      </p>
      {% endif %}
      <h3>状态</h3>
      <pre id="status">{{ status }}</pre>
      <h3>切换角色</h3>
      <select id="char-select">
        {% for c in characters %}
        <option value="{{ c }}" {% if c == active_character %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
      <button id="switch-char" style="width:100%;margin-top:.5rem;">应用</button>
    </aside>
  </div>
  <script src="{{ url_for('static', filename='js/stream_chat.js') }}"></script>
  <script>
    const csrfToken = '{{ csrf_token() }}';
    const activeCharacterId = {{ active_character_id if active_character_id is not none else 'null' }};
    const streamSessionId = 'user:{{ current_user.id }}';

    HarnessStreamChat.create({
      chatEl: document.getElementById('chat'),
      progressEl: document.getElementById('progress'),
      statusEl: document.getElementById('status'),
      inputEl: document.getElementById('message'),
      sendBtn: document.getElementById('send'),
      stopBtn: document.getElementById('stop'),
      csrfToken: csrfToken,
      streamUrl: '{{ url_for("data.stream_chat") }}',
      cancelUrl: '{{ url_for("data.cancel_generation") }}',
      syncUrl: '{{ url_for("data.api_chat") }}',
      characterId: activeCharacterId,
      sessionId: streamSessionId,
    });

    document.getElementById('switch-char').onclick = async () => {
      const key = document.getElementById('char-select').value;
      await fetch('{{ url_for("data.switch_character") }}', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrfToken,
        },
        body: JSON.stringify({ character_key: key }),
      });
      location.reload();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ character.display_name }} - 角色详情</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a1a2e; color: #eee; }
    .card { background: #16213e; color: #eee; border: 1px solid #334; }
    .card-header { background: #0f3460; border-bottom: 1px solid #334; }
    a { color: #4a90d9; }
  </style>
</head>
<body class="p-4">
  <div class="container" style="max-width:720px;">
    <div class="mb-3">
      <a href="{{ url_for('data.index') }}">← 返回对话</a>
    </div>
    <h2>{{ character.display_name }}</h2>
    <p class="text-muted">{{ character.role or '未设置定位' }}</p>
    {% if character.description %}
    <p>{{ character.description }}</p>
    {% endif %}
    <div class="mt-4 arc-readonly">
      {{ arc_card_html|safe }}
    </div>
    <div class="mt-3">
      <a class="btn btn-outline-primary btn-sm" href="{{ url_for('memory.memory_manage', character_id=character.id) }}">管理记忆</a>
      <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('memory.memory_page', character_id=character.id) }}">记忆可视化</a>
    </div>
    <p class="small text-muted mt-3">弧光状态仅供查看，如需修改请联系管理员。</p>
  </div>
</body>
</html>

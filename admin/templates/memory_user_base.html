<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Harness{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand">Harness · 角色记忆</span>
      <div>
        <a class="btn btn-sm btn-outline-light me-2" href="{{ url_for('data.index') }}">返回对话</a>
        <a class="btn btn-sm btn-outline-light" href="{{ url_for('auth.logout') }}">登出</a>
      </div>
    </div>
  </nav>
  <main class="container pb-4">
    <h2 class="mb-3">{% block page_title %}{% endblock %}</h2>
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
